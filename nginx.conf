# Served by the nginx inside the image. Host nginx only proxies to it.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    charset utf-8;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               application/xml image/svg+xml application/manifest+json;

    # Content-hashed build output is immutable.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Every non-hashed entry point must revalidate, including the service
    # worker: a stale sw.js pins the previous bundle.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location = /sw.js {
        add_header Cache-Control "no-cache";
    }

    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
    }

    location = /push-sw.js {
        add_header Cache-Control "no-cache";
    }

    # Client-side routes fall back to the shell.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
