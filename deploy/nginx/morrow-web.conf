# /etc/nginx/sites-available/<web-site>.conf
#
# Cloudflare terminates TLS (Flexible mode) and the origin serves plain HTTP on
# port 80. The real client IP comes from the host's shared
# /etc/nginx/conf.d/cloudflare.conf.
#
# Serves mrrw.my.id; keep the port equal to APP_PORT in /opt/morrow-web/.env.
#
# Install:
#   sudo cp deploy/nginx/morrow-web.conf /etc/nginx/sites-available/<web-site>.conf
#   sudo ln -s /etc/nginx/sites-available/<web-site>.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

upstream morrow_web {
    server 127.0.0.1:8082;
    keepalive 32;
}

# www goes to the bare domain, the canonical origin.
server {
    listen 80;
    listen [::]:80;
    server_name www.mrrw.my.id;
    return 301 https://mrrw.my.id$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name mrrw.my.id;

    access_log /var/log/nginx/morrow-web.access.log;
    error_log  /var/log/nginx/morrow-web.error.log;

    client_max_body_size 10M;
    server_tokens off;

    add_header X-Content-Type-Options     "nosniff" always;
    add_header X-Frame-Options            "SAMEORIGIN" always;
    add_header Referrer-Policy            "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security  "max-age=31536000; includeSubDomains" always;

    location / {
        proxy_pass http://morrow_web;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # Literal https: this hop is plain HTTP, but the visitor is on HTTPS.
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        proxy_buffering on;
        proxy_redirect off;
    }
}
