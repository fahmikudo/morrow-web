# Test and build the SPA on GitHub, push the image to GHCR, and let the server
# pull it. The server never compiles anything. See DEPLOYMENT.md.
#
# Image tags (docker/metadata-action):
#   sha-<short>   every push to main and every release — what a rollback names
#   edge          the tip of main
#   X.Y.Z, X.Y    a release tag vX.Y.Z
#   latest        a release tag
#
# Only a release tag (v*) deploys. A merge to main publishes the image and stops.
name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  REGISTRY: ghcr.io
  # Public API origin without a trailing slash: https://api.mrrw.my.id/api/v1 —
  # set it as a repository variable. Inlined into the bundle at build time.
  VITE_API_URL: ${{ vars.VITE_API_URL }}

jobs:
  web:
    name: Web (typecheck, test & build)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
        env:
          VITE_API_URL: ${{ env.VITE_API_URL }}

  deploy-files:
    name: Deploy files
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Shellcheck deploy script
        run: shellcheck -x --severity=warning deploy/deploy.sh

      - name: Validate production compose
        run: |
          dir="$(mktemp -d)"
          cp deploy/docker-compose.yml "$dir/docker-compose.yml"
          cp deploy/.env.example "$dir/.env"
          MORROW_WEB_IMAGE_TAG=ci docker compose -f "$dir/docker-compose.yml" config --quiet

  build-push:
    name: Build and push image
    needs: [web, deploy-files]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ steps.meta.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - name: Require VITE_API_URL
        # An empty value silently builds the localStorage demo bundle, which
        # must never reach production.
        run: |
          if [ -z "${VITE_API_URL}" ]; then
            echo "::error::Set the VITE_API_URL repository variable (Settings → Variables)"
            exit 1
          fi

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}
          tags: |
            type=sha,format=short,prefix=sha-
            type=edge,branch=main
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VITE_API_URL=${{ env.VITE_API_URL }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

  deploy:
    name: Deploy to production
    needs: build-push
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # Holds the SSH secrets; give it Required reviewers for a one-click approval.
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Check deploy secrets
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          missing=""
          for name in DEPLOY_HOST DEPLOY_PORT DEPLOY_USER DEPLOY_SSH_KEY DEPLOY_KNOWN_HOSTS; do
            if [ -z "${!name}" ]; then missing="${missing} ${name}"; fi
          done
          if [ -n "${missing}" ]; then
            echo "::error::Missing secrets in the production environment:${missing}"
            exit 1
          fi

      - name: Authorise SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          # Fingerprint is printed so it can be compared with the server:
          #   ssh-keygen -lf ~deploy/.ssh/authorized_keys
          ssh-keygen -y -f ~/.ssh/id_deploy > ~/.ssh/id_deploy.pub
          ssh-keygen -lf ~/.ssh/id_deploy.pub
          printf '%s\n' "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      - name: Test SSH access
        run: |
          ssh -i ~/.ssh/id_deploy -p "${{ secrets.DEPLOY_PORT }}" \
            -o IdentitiesOnly=yes -o BatchMode=yes \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" true

      - name: Ship compose file and deploy script
        run: |
          scp -i ~/.ssh/id_deploy -P "${{ secrets.DEPLOY_PORT }}" \
            -o IdentitiesOnly=yes -o BatchMode=yes \
            deploy/docker-compose.yml deploy/deploy.sh \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/opt/morrow-web/"

      - name: Pull and restart
        env:
          TAG: ${{ needs.build-push.outputs.version }}
        run: |
          ssh -i ~/.ssh/id_deploy -p "${{ secrets.DEPLOY_PORT }}" \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "chmod +x /opt/morrow-web/deploy.sh && /opt/morrow-web/deploy.sh MORROW_WEB_IMAGE_TAG '${TAG}' web"

      # Set the WEB_URL repository variable to https://mrrw.my.id.
      # Without it the check is skipped.
      - name: Smoke test
        if: vars.WEB_URL != ''
        run: curl -fsS --max-time 10 -o /dev/null "${WEB_URL}/"
        env:
          WEB_URL: ${{ vars.WEB_URL }}
